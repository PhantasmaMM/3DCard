<div class="scene" id="scene"><div class="card" id="card"><div class="shadow"></div></div></div>
<script>
const card=document.getElementById('card'),scene=document.getElementById('scene');
for(let z=-4;z<=4;z++){const l=document.createElement('div');l.className='layer';l.style.transform='translateZ('+z+'px)';card.appendChild(l)}
const f=document.createElement('div');f.className='face front';f.innerHTML='<div class="glare"></div>';
const b=document.createElement('div');b.className='face back';b.innerHTML='<div class="glare"></div>';
card.appendChild(f);card.appendChild(b);
let ty=0,tx=0,cy=0,cx=0,hy=0,hx=0,drag=false,moved=0,lx=0,ly=0,t0=0;
const clamp=(v,a,c)=>Math.max(a,Math.min(c,v));
scene.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;scene.setPointerCapture(e.pointerId)});
scene.addEventListener('pointermove',e=>{
 const r=scene.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
 if(drag){const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);ty+=dx*.6;tx=clamp(tx-dy*.3,-30,30);lx=e.clientX;ly=e.clientY}
 else{hy=(px-.5)*16;hx=-(py-.5)*16}
 document.querySelectorAll('.glare').forEach(g=>{g.style.setProperty('--gx',px*100+'%');g.style.setProperty('--gy',py*100+'%')})});
scene.addEventListener('pointerup',()=>{drag=false;if(moved<6)ty+=180;ty=Math.round(ty/180)*180;tx=0});
scene.addEventListener('pointerleave',()=>{hx=hy=0});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key===' '){ty=Math.round(ty/180)*180+(e.key==='ArrowLeft'?-180:180)}});
(function loop(t){
